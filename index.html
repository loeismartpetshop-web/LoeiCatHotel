<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="หน้าเข้าสู่ระบบจองห้องพัก LOEI CAT HOTEL" />
    <title>LOEI CAT HOTEL Booking</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Tahoma, "Noto Sans Thai", sans-serif;
        color: #24322e;
        background: #f6f0e5;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(201, 121, 78, 0.13), transparent 30%),
          linear-gradient(145deg, #f8f3e9, #edf3ef);
      }

      main {
        width: min(100%, 520px);
        padding: 44px 32px;
        border: 1px solid rgba(40, 74, 64, 0.14);
        border-radius: 26px;
        text-align: center;
        background: #fffefb;
        box-shadow: 0 22px 70px rgba(24, 47, 39, 0.12);
      }

      .mark {
        width: 66px;
        height: 66px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 50%;
        color: #f8e8c8;
        background: #1b372f;
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: 700;
      }

      h1 { margin: 0; color: #1b372f; font-size: 25px; letter-spacing: 0.08em; }
      h2 { margin: 5px 0 14px; color: #3f6558; font-size: 17px; font-weight: 600; }
      p { margin: 0 0 24px; color: #69766f; font-size: 14px; line-height: 1.7; }

      a {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 13px 24px;
        border-radius: 13px;
        color: #fff;
        background: #284a40;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 9px 22px rgba(40, 74, 64, 0.2);
      }

      a:hover { background: #1b372f; }
      small { display: block; margin-top: 18px; color: #8a938e; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">L</div>
      <h1>LOEI CAT HOTEL</h1>
      <h2>โรงแรมแมวเมืองเลย</h2>
      <p>กดปุ่มด้านล่างเพื่อเปิด Customer Booking Web App เวอร์ชันทดสอบ</p>
      <a href="https://loei-cat-hotel-booking.chaisamartk.chatgpt.site">
        เปิดหน้าจองห้องพัก <span aria-hidden="true">→</span>
      </a>
      <small>ขณะนี้ยังเป็นระบบต้นแบบและยังไม่รับจองจริง</small>
    </main>
  </body>
</html>
